name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, sockets, fileinfo, zip
          coverage: none

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure assets are built
        run: |
          if [ ! -f "public/build/manifest.json" ]; then
            npm install
            npm run build
          else
            echo "Pre-built production assets found in public/build."
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (x86_64 / amd64)
        run: |
          docker build --platform linux/amd64 \
            -t ghcr.io/jacob157-rgb/lnet-access:latest \
            -t ghcr.io/jacob157-rgb/lnet-access:${{ github.sha }} \
            -f Dockerfile .

      - name: Push Docker Image to GHCR
        run: |
          docker push ghcr.io/jacob157-rgb/lnet-access:latest
          docker push ghcr.io/jacob157-rgb/lnet-access:${{ github.sha }}
