<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logout - AgungWifi Hotspot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-wrap" style="background: linear-gradient(135deg, #64748b 0%, #475569 100%);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </div>
                <h1>Anda Telah Logout</h1>
                <p>Terima kasih telah menggunakan layanan AgungWifi</p>
            </div>

            <table class="status-table">
                <tr>
                    <td>Nama Pengguna</td>
                    <td>$(username)</td>
                </tr>
                <tr>
                    <td>Alamat IP</td>
                    <td>$(ip)</td>
                </tr>
                <tr>
                    <td>Durasi Pemakaian</td>
                    <td>$(uptime)</td>
                </tr>
                <tr>
                    <td>Total Data (Up / Down)</td>
                    <td>$(bytes-in-nice) / $(bytes-out-nice)</td>
                </tr>
            </table>

            <div style="margin-top:16px;">
                <a href="$(link-login)" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    <span>Login Kembali</span>
                </a>
            </div>

            <div class="footer">
                <p>&copy; AgungWifi &bull; Didukung MikroTik RouterOS</p>
            </div>
        </div>
    </div>
</body>
</html>
