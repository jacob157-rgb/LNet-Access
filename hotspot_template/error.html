<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kesalahan - AgungWifi Hotspot</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-wrap" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <h1>Terjadi Kesalahan</h1>
                <p>Gagal memproses permintaan login hotspot</p>
            </div>

            <div class="alert alert-danger">
                <div>$(error)</div>
            </div>

            <div style="margin-top:16px;">
                <a href="$(link-login)" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <span>Kembali ke Halaman Login</span>
                </a>
            </div>

            <div class="footer">
                <p>&copy; AgungWifi &bull; Didukung MikroTik RouterOS</p>
            </div>
        </div>
    </div>
</body>
</html>
